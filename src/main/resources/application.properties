# PostgreSQL Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# Database URL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/attenddb}

# DB Username
spring.datasource.username=${DB_USERNAME}

# DB Password
spring.datasource.password=${DB_PASSWORD}

# SQL Init
spring.sql.init.mode=never

# Flyway migrations are enabled explicitly per environment.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.schemas=public
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false
# V014 uses CREATE INDEX CONCURRENTLY, which requires Flyway's PostgreSQL
# session-level advisory lock instead of the default transactional lock.
spring.flyway.postgresql.transactional-lock=false

# Logging
# Production changes the console format to JSON. SQL and parameter logging stays
# disabled because it can contain teacher contact data or card identifiers.
logging.level.com.example.attend.repository=INFO

# Actuator is bound to a loopback-only management port. Only the aggregate health
# endpoint is exposed; Caddy and the application port never proxy this port.
management.server.address=${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
management.server.port=${MANAGEMENT_SERVER_PORT:8081}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Active Profile
#spring.profiles.active=dev

# Attendance setting
attendance.late-time=09:00
attendance.scheduler.enabled=${ATTENDANCE_SCHEDULER_ENABLED:false}
attendance.scheduler.lease-duration=PT2M
attendance.scheduler.recovery-delay=PT1M
attendance.scheduler.claim-limit=20

# Telegram notification delivery remains disabled until a bot, webhook secret,
# and separate link-token pepper have been provisioned.
attendance.telegram.enabled=${TELEGRAM_NOTIFICATIONS_ENABLED:false}
attendance.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
attendance.telegram.bot-username=${TELEGRAM_BOT_USERNAME:}
attendance.telegram.webhook-secret=${TELEGRAM_WEBHOOK_SECRET:}
attendance.telegram.link-token-pepper=${TELEGRAM_LINK_TOKEN_PEPPER:}
attendance.telegram.dispatch-fixed-delay-ms=30000
attendance.telegram.max-attempts=10
attendance.telegram.max-listed-members=30

# External backup jobs may atomically replace a small Java-properties status
# file. When no file is configured, the five backup metadata environment values
# below are used. The file takes precedence so a broken live source can never
# be masked by stale environment values. Only timestamps, result and an
# allowlisted storage type are accepted; paths, checksums and credentials are
# never exposed.
attendance.operations.backup.status-file=${BACKUP_STATUS_FILE:}
attendance.operations.backup.max-age=${BACKUP_STATUS_MAX_AGE:PT24H}
attendance.operations.backup.result=${BACKUP_STATUS_RESULT:}
attendance.operations.backup.observed-at=${BACKUP_STATUS_OBSERVED_AT:}
attendance.operations.backup.last-success-at=${BACKUP_LAST_SUCCESS_AT:}
attendance.operations.backup.storage-type=${BACKUP_STORAGE_TYPE:}
attendance.operations.backup.last-restore-test-at=${BACKUP_LAST_RESTORE_TEST_AT:}

# Administrator writes stay off unless the environment explicitly enables them.
attendance.admin.write-enabled=${ADMIN_WRITE_ENABLED:false}
attendance.admin.show-tag-logs=${ADMIN_SHOW_TAG_LOGS:false}
attendance.admin.account-token-pepper=${ACCOUNT_TOKEN_PEPPER:}
attendance.admin.public-base-url=${PUBLIC_BASE_URL:}

# Device requests stay unavailable until both the server implementation and the
# runtime credential pepper are explicitly enabled.
device-api.enabled=${DEVICE_API_ENABLED:false}
device-api.credential-pepper=${DEVICE_CREDENTIAL_PEPPER:}

# When configured, only the reverse proxy that knows this token may supply the
# client address used by source-based rate limits. Production requires it.
attendance.proxy.shared-token=${TRUSTED_PROXY_TOKEN:}

# Web administrator session policy
# Idle sessions expire after 30 minutes. AbsoluteSessionTimeoutFilter separately
# enforces the documented eight-hour maximum lifetime.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

#snake_case to camelCase
mybatis.configuration.map-underscore-to-camel-case=true
