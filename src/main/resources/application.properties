# PostgreSQL Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# Database URL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/attenddb}

# DB Username
spring.datasource.username=${DB_USERNAME}

# DB Password
spring.datasource.password=${DB_PASSWORD}

# SQL Init
spring.sql.init.mode=never

# Flyway migrations are enabled explicitly per environment.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.schemas=public
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false

# Logging
# Production changes the console format to JSON. SQL and parameter logging stays
# disabled because it can contain teacher contact data or card identifiers.
logging.level.com.example.attend.repository=INFO

# Actuator is bound to a loopback-only management port. Only the aggregate health
# endpoint is exposed; Caddy and the application port never proxy this port.
management.server.address=${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
management.server.port=${MANAGEMENT_SERVER_PORT:8081}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Active Profile
#spring.profiles.active=dev

# Attendance setting
attendance.late-time=09:00
attendance.scheduler.enabled=false
attendance.scheduler.fixed-delay-ms=300000

# Administrator writes stay off unless the environment explicitly enables them.
attendance.admin.write-enabled=${ADMIN_WRITE_ENABLED:false}
attendance.admin.account-token-pepper=${ACCOUNT_TOKEN_PEPPER:}
attendance.admin.public-base-url=${PUBLIC_BASE_URL:}

# Device requests stay unavailable until both the server implementation and the
# runtime credential pepper are explicitly enabled.
device-api.enabled=${DEVICE_API_ENABLED:false}
device-api.credential-pepper=${DEVICE_CREDENTIAL_PEPPER:}

# Web administrator session policy
# Idle sessions expire after 30 minutes. AbsoluteSessionTimeoutFilter separately
# enforces the documented eight-hour maximum lifetime.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

#snake_case to camelCase
mybatis.configuration.map-underscore-to-camel-case=true
