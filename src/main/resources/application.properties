# PostgreSQL Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# Database URL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/attenddb}

# DB Username
spring.datasource.username=${DB_USERNAME}

# DB Password
spring.datasource.password=${DB_PASSWORD}

# SQL Init
spring.sql.init.mode=never

# Flyway migrations are enabled explicitly per environment.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.schemas=public
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false

# Logging
logging.level.com.example.attend.repository=DEBUG

# Active Profile
#spring.profiles.active=dev

# Attendance setting
attendance.late-time=09:00
attendance.scheduler.enabled=false
attendance.scheduler.fixed-delay-ms=300000

#snake_case to camelCase
mybatis.configuration.map-underscore-to-camel-case=true
