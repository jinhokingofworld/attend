# Production must fail fast when an explicit database connection is missing.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Fail operational requests quickly when the pool cannot provide a connection.
# Statement-level checks have their own three-second query timeout as well.
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2500

# Production schema changes run in a separate, approved migration job.
spring.sql.init.mode=never
spring.flyway.enabled=false

# HTTPS is mandatory in production, so the session cookie must never travel over
# an unencrypted connection.
server.servlet.session.cookie.secure=true

# One JSON object per log event makes production logs machine-readable. The
# customizer masks credentials, tokens, complete NFC UIDs and contact numbers.
logging.structured.format.console=logstash
logging.structured.json.customizer=com.example.attend.operations.logging.SensitiveStructuredLoggingCustomizer
