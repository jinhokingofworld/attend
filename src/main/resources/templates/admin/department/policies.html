<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>출석 정책</title>    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<header th:replace="~{fragments/admin-shell :: header}"></header>
<main>
    <h1 th:text="|${department.name} · 출석 정책|">출석 정책</h1>
    <p th:if="${message}" class="message message--success" th:text="${message}"></p>
    <p th:if="${error}" class="message message--error" th:text="${error}" role="alert"></p>
    <p th:unless="${writeEnabled}">읽기 전용 모드</p>
    <section th:if="${writeEnabled}">
        <h2>출석 정책 생성</h2>
        <p>첫 단계는 정상 출석이어야 하며 단계별 종료 시각은 오름차순이어야 합니다.</p>
        <p class="policy-finalization-help">마지막 단계의 마감 시간까지 태깅을 허용하고, 1µs 후 미출석자는 결석 처리 대상이 됩니다.</p>
        <form th:action="@{/admin/departments/{id}/policies(id=${department.id})}" method="post">
            <label>정책 이름 <input name="name" maxlength="100" required></label>
            <label>적용 시작일 <input type="date" name="startDate" required></label>
            <label>적용 종료일 <input type="date" name="endDate">
                <small>비워 두면 활성화 시점부터 6개월 범위만 먼저 생성합니다.</small>
            </label>
            <label>태깅 시작 <input type="time" name="checkInStartTime" required></label>
            <fieldset>
                <legend>반복 조건</legend>
                <label><input type="radio" name="recurrence" value="NONE" checked> 한 번만</label>
                <label><input type="radio" name="recurrence" value="DAILY"> 매일</label>
                <label><input type="radio" name="recurrence" value="WEEKLY"> 매주</label>
                <label><input type="radio" name="recurrence" value="MONTHLY"> 매월</label>
                <label><input type="radio" name="recurrence" value="YEARLY"> 매년</label>
                <label>반복 간격 <input type="number" name="interval" min="1" value="1" required></label>
                <fieldset>
                    <legend>반복 요일 (매주)</legend>
                    <label th:each="day : ${T(java.time.DayOfWeek).values()}">
                        <input type="checkbox" name="weeklyDays" th:value="${day}"
                               th:text="${#strings.substring(day.toString(), 0, 3)}"> 요일
                    </label>
                </fieldset>
                <fieldset>
                    <legend>반복 날짜 (매월)</legend>
                    <label th:each="day : ${#numbers.sequence(1, 31)}">
                        <input type="checkbox" name="monthlyDays" th:value="${day}">
                        <span th:text="|${day}일|">1일</span>
                    </label>
                </fieldset>
                <fieldset>
                    <legend>반복 월·일 (매년)</legend>
                    <label>월 <input type="number" name="yearlyMonth" min="1" max="12"></label>
                    <label>일 <input type="number" name="yearlyDay" min="1" max="31"></label>
                </fieldset>
            </fieldset>
            <fieldset id="bands">
                <legend>출석 단계</legend>
                <div class="band-row">
                    <input name="bandLabel" value="정상 출석" maxlength="50" required>
                    <select name="bandStatus"><option value="PRESENT">정상</option><option value="LATE">지각</option></select>
                    <label><span class="band-time-label">단계 종료 시간</span>
                        <input type="time" name="bandUpperTime" required>
                    </label>
                    <button type="button" class="remove-band">단계 삭제</button>
                </div>
                <div class="band-row band-row--final">
                    <input name="bandLabel" value="1차 지각" maxlength="50" required>
                    <select name="bandStatus"><option value="LATE">지각</option><option value="PRESENT">정상</option></select>
                    <label><span class="band-time-label">마감 시간 (마지막 태깅 허용 시각)</span>
                        <input type="time" name="bandUpperTime" required>
                    </label>
                    <button type="button" class="remove-band">단계 삭제</button>
                </div>
            </fieldset>
            <button type="button" id="addBand">단계 추가</button>
            <button type="submit">정책 저장</button>
        </form>
    </section>
    <section>
        <h2>출석 정책</h2>
        <article th:each="policy : ${policies}">
            <h3 th:text="${policy.name}">정책</h3>
            <p th:text="|${policy.status} · ${policy.start_date}${policy.end_date == null ? ' 이후' : ' ~ ' + policy.end_date}|">기간</p>
            <p th:text="|${policy.recurrence} · ${policy.interval_value} 간격 · 태깅 시작 ${policy.check_in_start_time} · 마감 ${policy.final_upper_time}|">반복과 시간</p>
            <a th:if="${policy.status != 'ARCHIVED'}"
               th:href="@{/admin/departments/{departmentId}/policies/{policyId}/edit(departmentId=${department.id},policyId=${policy.id})}">수정</a>
            <form th:if="${writeEnabled and policy.status != 'ARCHIVED'}"
                  th:action="@{/admin/departments/{departmentId}/policies/{policyId}/enabled(departmentId=${department.id},policyId=${policy.id})}"
                  method="post">
                <input type="hidden" name="enabled" th:value="${policy.status != 'ON'}">
                <button type="submit" th:text="${policy.status == 'ON'} ? 'OFF' : 'ON'">ON/OFF</button>
            </form>
            <form th:if="${writeEnabled and policy.status != 'ARCHIVED'}"
                  th:action="@{/admin/departments/{departmentId}/policies/{policyId}/archive(departmentId=${department.id},policyId=${policy.id})}"
                  method="post">
                <input type="hidden" name="reason" value="관리자 정책 삭제 요청">
                <button type="submit" class="remove-band">삭제(보관)</button>
            </form>
        </article>
        <p th:if="${#lists.isEmpty(policies)}">등록된 정책이 없습니다.</p>
    </section>
    <a th:href="@{/admin/departments/{id}(id=${department.id})}">부서 홈</a>
</main>
<script>
const updateFinalizationLabels = () => {
    const rows = [...document.querySelectorAll("#bands .band-row")];
    rows.forEach((row, index) => {
        const isFinal = index === rows.length - 1;
        row.classList.toggle("band-row--final", isFinal);
        row.querySelector(".band-time-label").textContent = isFinal
            ? "마감 시간 (마지막 태깅 허용 시각)"
            : "단계 종료 시간";
        row.querySelector(".remove-band").disabled = index === 0 || rows.length <= 2;
    });
};

document.getElementById("addBand")?.addEventListener("click", () => {
    const row = document.querySelector("#bands .band-row").cloneNode(true);
    row.querySelector("input[name='bandLabel']").value = "";
    row.querySelector("select[name='bandStatus']").value = "LATE";
    row.querySelector("input[name='bandUpperTime']").value = "";
    document.getElementById("bands").appendChild(row);
    updateFinalizationLabels();
});

document.getElementById("bands")?.addEventListener("click", (event) => {
    const removeButton = event.target.closest(".remove-band");
    if (!removeButton || removeButton.disabled) return;

    removeButton.closest(".band-row").remove();
    updateFinalizationLabels();
});
updateFinalizationLabels();
</script>
</body>
</html>
