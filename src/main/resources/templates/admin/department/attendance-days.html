<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>출석 날짜</title>    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<header th:replace="~{fragments/admin-shell :: header}"></header>
<main>
    <h1 th:text="|${department.name} · 출석 날짜|">출석 날짜</h1>
    <p th:if="${message}" th:text="${message}"></p>
    <p th:if="${error}" th:text="${error}" role="alert"></p>
    <p th:unless="${writeEnabled}">읽기 전용 모드</p>
    <form th:if="${writeEnabled and !#lists.isEmpty(publishedPolicies)}"
          th:action="@{/admin/departments/{id}/attendance-days(id=${department.id})}"
          method="post">
        <label>시작 날짜 <input type="date" name="attendanceDate" required></label>
        <label>발행 정책
            <select name="policyVersionId" required>
                <option th:each="policy : ${publishedPolicies}"
                        th:value="${policy.id}"
                        th:text="|v${policy.version_no} · ${policy.name}|">정책</option>
            </select>
        </label>
        <fieldset>
            <legend>반복</legend>
            <label><input type="radio" name="recurrence" value="NONE" checked> 반복 없음</label>
            <label><input type="radio" name="recurrence" value="DAILY"> 일마다</label>
            <label><input type="radio" name="recurrence" value="WEEKLY"> 주마다</label>
            <label><input type="radio" name="recurrence" value="MONTHLY"> 개월마다</label>
            <label><input type="radio" name="recurrence" value="YEARLY"> 년마다</label>
        </fieldset>
        <section id="recurrenceOptions" hidden>
            <label>반복 간격
                <input type="number" name="interval" min="1" value="1" disabled required>
                <span id="intervalUnit">일</span>마다
            </label>
            <label>반복 종료일
                <input type="date" name="endDate" disabled>
                <small>시작 날짜부터 최대 5년까지 생성할 수 있습니다.</small>
            </label>
            <fieldset data-recurrence="WEEKLY" hidden>
                <legend>반복 요일</legend>
                <label><input type="checkbox" name="weeklyDays" value="MONDAY" disabled> 월</label>
                <label><input type="checkbox" name="weeklyDays" value="TUESDAY" disabled> 화</label>
                <label><input type="checkbox" name="weeklyDays" value="WEDNESDAY" disabled> 수</label>
                <label><input type="checkbox" name="weeklyDays" value="THURSDAY" disabled> 목</label>
                <label><input type="checkbox" name="weeklyDays" value="FRIDAY" disabled> 금</label>
                <label><input type="checkbox" name="weeklyDays" value="SATURDAY" disabled> 토</label>
                <label><input type="checkbox" name="weeklyDays" value="SUNDAY" disabled> 일</label>
            </fieldset>
            <fieldset data-recurrence="MONTHLY" hidden>
                <legend>반복 날짜</legend>
                <label th:each="day : ${#numbers.sequence(1, 31)}">
                    <input type="checkbox" name="monthlyDays" th:value="${day}" disabled>
                    <span th:text="${day}">1</span>일
                </label>
                <p>해당 월에 없는 날짜는 건너뜁니다.</p>
            </fieldset>
            <fieldset data-recurrence="YEARLY" hidden>
                <legend>반복 월·일</legend>
                <label>월
                    <select name="yearlyMonth" disabled>
                        <option th:each="month : ${#numbers.sequence(1, 12)}"
                                th:value="${month}" th:text="|${month}월|">1월</option>
                    </select>
                </label>
                <label>일
                    <select name="yearlyDay" disabled>
                        <option th:each="day : ${#numbers.sequence(1, 31)}"
                                th:value="${day}" th:text="|${day}일|">1일</option>
                    </select>
                </label>
            </fieldset>
        </section>
        <button type="submit">출석 날짜 생성·대상 snapshot</button>
    </form>
    <p th:if="${#lists.isEmpty(publishedPolicies)}">먼저 출석 정책을 발행해야 합니다.</p>
    <table>
        <thead><tr><th>날짜</th><th>정책</th><th>상태</th><th>대상</th><th>기록</th></tr></thead>
        <tbody>
        <tr th:each="day : ${days}">
            <td><a th:href="@{/admin/departments/{departmentId}/attendance-days/{dayId}(departmentId=${department.id},dayId=${day.id})}"
                   th:text="${day.attendance_date}">날짜</a></td>
            <td th:text="${day.policy_name}">정책</td>
            <td th:text="${day.status}">상태</td>
            <td th:text="${day.target_count}">0</td>
            <td th:text="${day.record_count}">0</td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{/admin/departments/{id}(id=${department.id})}">부서 홈</a>
</main>
<script>
const recurrenceInputs = document.querySelectorAll("input[name='recurrence']");
const recurrenceOptions = document.getElementById("recurrenceOptions");
const startDateInput = document.querySelector("input[name='attendanceDate']");
const intervalInput = document.querySelector("input[name='interval']");
const endDateInput = document.querySelector("input[name='endDate']");
const yearlyMonthInput = document.querySelector("select[name='yearlyMonth']");
const yearlyDayInput = document.querySelector("select[name='yearlyDay']");
const intervalUnits = {
    DAILY: "일",
    WEEKLY: "주",
    MONTHLY: "개월",
    YEARLY: "년"
};

function setEnabled(container, enabled) {
    container.querySelectorAll("input, select").forEach(input => input.disabled = !enabled);
}

function updateRecurrenceOptions() {
    const recurrence = document.querySelector("input[name='recurrence']:checked").value;
    const repeats = recurrence !== "NONE";
    recurrenceOptions.hidden = !repeats;
    intervalInput.disabled = !repeats;
    endDateInput.disabled = !repeats;
    endDateInput.required = repeats;
    if (repeats) {
        document.getElementById("intervalUnit").textContent = intervalUnits[recurrence];
    }
    document.querySelectorAll("[data-recurrence]").forEach(section => {
        const selected = section.dataset.recurrence === recurrence;
        section.hidden = !selected;
        setEnabled(section, selected);
    });
}

function updateEndDateBounds() {
    if (!startDateInput.value) {
        endDateInput.removeAttribute("min");
        endDateInput.removeAttribute("max");
        return;
    }
    const [year, month, day] = startDateInput.value.split("-").map(Number);
    const maximumDay = new Date(year + 5, month, 0).getDate();
    const maximumDate = `${year + 5}-${String(month).padStart(2, "0")}-${String(Math.min(day, maximumDay)).padStart(2, "0")}`;
    endDateInput.min = startDateInput.value;
    endDateInput.max = maximumDate;
}

function updateYearlyDayOptions() {
    const maximumDay = new Date(2024, Number(yearlyMonthInput.value), 0).getDate();
    yearlyDayInput.querySelectorAll("option").forEach(option => {
        option.disabled = Number(option.value) > maximumDay;
    });
    if (Number(yearlyDayInput.value) > maximumDay) {
        yearlyDayInput.value = String(maximumDay);
    }
}

recurrenceInputs.forEach(input => input.addEventListener("change", updateRecurrenceOptions));
startDateInput.addEventListener("change", updateEndDateBounds);
yearlyMonthInput.addEventListener("change", updateYearlyDayOptions);
updateRecurrenceOptions();
updateEndDateBounds();
updateYearlyDayOptions();
</script>
</body>
</html>
