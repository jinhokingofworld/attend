<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>멤버 관리</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<header th:replace="~{fragments/admin-shell :: header}"></header>
<main>
    <div class="page-heading">
        <div>
            <p class="eyebrow" th:text="${department.name}">부서</p>
            <h1>멤버</h1>
            <p>현재 부서에 소속된 교사와 NFC 카드 연결 상태를 확인합니다.</p>
        </div>
        <a class="button-link button-link--secondary"
           th:href="@{/admin/departments/{id}(id=${department.id})}">대시보드</a>
    </div>

    <p th:if="${message}" class="message message--success" th:text="${message}"></p>
    <p th:if="${error}" class="message message--error" th:text="${error}" role="alert"></p>
    <p th:unless="${writeEnabled}" class="message message--info">읽기 전용 모드입니다.</p>

    <details th:if="${writeEnabled}" class="disclosure">
        <summary>새 교사 추가</summary>
        <form th:action="@{/admin/departments/{id}/teachers(id=${department.id})}" method="post">
            <label>이름 <input name="name" maxlength="255" required></label>
            <label>연락처 <input name="phone" maxlength="255"></label>
            <label>생년월일 <input type="date" name="birth" required th:max="${today}"></label>
            <label>NFC UID(선택) <input name="cardUid" placeholder="A1B2C3D4"></label>
            <button type="submit">교사 추가</button>
        </form>
    </details>

    <section>
        <div class="section-heading">
            <h2>현재 멤버</h2>
            <span class="count-badge" th:text="|${#lists.size(teachers)}명|">0명</span>
        </div>
        <div class="table-scroll">
            <table>
                <thead>
                <tr><th>이름</th><th>나이</th><th>연락처</th><th>NFC 카드</th><th>상태</th></tr>
                </thead>
                <tbody>
                <tr class="clickable-row"
                    th:each="teacher : ${teachers}"
                    th:attr="data-row-href=@{/admin/departments/{departmentId}/teachers/{memberId}(departmentId=${department.id},memberId=${teacher.id})}"
                    tabindex="0">
                    <td>
                        <a th:href="@{/admin/departments/{departmentId}/teachers/{memberId}(departmentId=${department.id},memberId=${teacher.id})}"
                           th:text="${teacher.name}">교사</a>
                    </td>
                    <td th:text="${teacher['display_age'] ?: '미상'}">미상</td>
                    <td th:text="${teacher['phone'] ?: '-'}">-</td>
                    <td th:text="${teacher['masked_uid'] ?: '미등록'}">미등록</td>
                    <td>
                        <span class="status-chip"
                              th:classappend="${teacher['card_id'] == null} ? ' status-chip--muted' : ' status-chip--success'"
                              th:text="${teacher['card_id'] == null} ? '카드 미등록' : '사용 중'">상태</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <p th:if="${#lists.isEmpty(teachers)}" class="empty-state">활성 교사가 없습니다.</p>
        <p class="table-help">행을 선택하면 교사 상세정보와 수정 화면으로 이동합니다.</p>
    </section>
</main>
</body>
</html>
