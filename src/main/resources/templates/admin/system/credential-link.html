<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>일회용 링크 발급</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<header th:replace="~{fragments/admin-shell :: header}"></header>
<main>
    <h1>일회용 링크 발급 완료</h1>
    <p>이 링크는 지금 한 번만 표시됩니다. 승인된 1:1 메신저로 직접 전달하세요.</p>
    <p>애플리케이션은 메신저로 자동 발송하거나 이 원문 링크를 다시 저장하지 않습니다.</p>
    <label>복사할 링크
        <textarea readonly rows="5" cols="80" th:text="${issued.link}">링크</textarea>
    </label>
    <p th:text="|만료 시각: ${issued.expiresAt}|">만료</p>
    <a th:href="@{/admin/system/accounts}">계정 목록으로 이동</a>
</main>
</body>
</html>
