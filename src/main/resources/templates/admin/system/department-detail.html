<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>부서 상세</title></head>
<body>
<main>
    <h1 th:text="${department.name}">부서</h1>
    <p th:text="|활성 관리자 ${department.administrator_count}명|">관리자</p>
    <p th:text="|장치 ${department.device_count}대|">장치</p>
    <section>
        <h2>활성 부서 관리자</h2>
        <ul>
            <li th:each="administrator : ${administrators}"
                th:text="|${administrator.username} · ${administrator.status}|">관리자</li>
        </ul>
        <p th:if="${#lists.isEmpty(administrators)}">지정된 관리자가 없습니다.</p>
    </section>
    <section>
        <h2>장치 요약</h2>
        <ul>
            <li th:each="device : ${devices}"
                th:text="|${device.name} · ${device.status}|">장치</li>
        </ul>
        <p th:if="${#lists.isEmpty(devices)}">등록된 장치가 없습니다.</p>
        <p><a th:href="@{/admin/system/devices}">장치 관리에서 등록·키·상태를 관리합니다.</a></p>
    </section>
    <a th:href="@{/admin/system/departments}">부서 목록</a>
</main>
</body>
</html>
