<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>장치 폐기</title>    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<main>
    <h1>장치 폐기</h1>
    <p>REVOKED 상태는 되돌릴 수 없습니다. 같은 물리 장치를 다시 쓰려면 새 장치로 등록해야 합니다.</p>
    <p th:if="${error}" th:text="${error}">오류</p>
    <form th:action="@{/admin/system/devices/{id}/revoke(id=${device.id})}" method="post">
        <label>장치 코드 확인 <input name="deviceCodeConfirmation" required></label>
        <label>사유 <textarea name="reason" required maxlength="500"></textarea></label>
        <button type="submit" th:disabled="${!writeEnabled or device.status == 'REVOKED'}">영구 폐기</button>
    </form>
    <a th:href="@{/admin/system/devices/{id}(id=${device.id})}">취소</a>
</main>
</body>
</html>
