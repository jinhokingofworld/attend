<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>계정 생성</title></head>
<body>
<main>
    <h1>계정 생성</h1>
    <p th:if="${error}" th:text="${error}" role="alert"></p>
    <form th:action="@{/admin/system/accounts}" method="post">
        <label>사용자명
            <input name="username" maxlength="100" required th:value="${username}">
        </label>
        <label>
            <input type="checkbox" name="systemAdmin" value="true">
            시스템 관리자 역할 부여
        </label>
        <button type="submit">초대 대기 계정 생성</button>
    </form>
    <a th:href="@{/admin/system/accounts}">취소</a>
</main>
</body>
</html>
