<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-store">
    <title>장치 비밀키 1회 표시</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<header th:replace="~{fragments/admin-shell :: header}"></header>
<main>
    <h1>장치 비밀키</h1>
    <p>이 화면을 떠나면 비밀키를 다시 볼 수 없습니다. 브라우저에 저장하거나 인쇄하지 마세요.</p>
    <dl>
        <dt>장치 코드</dt><dd th:text="${issued.deviceCode}">entrance-01</dd>
        <dt>비밀키</dt><dd><code th:text="${issued.deviceKey}">secret</code></dd>
        <dt>credential version</dt><dd th:text="${issued.credentialVersion}">1</dd>
    </dl>
    <p>실제 장치에 두 값을 주입한 뒤 장치가 credential-test API를 호출하게 하세요.</p>
    <form th:action="@{/admin/system/devices/{id}(id=${issued.deviceId})}" method="get">
        <label><input type="checkbox" required> 장치 설정을 완료했고 이 키를 다시 볼 수 없음을 확인했습니다.</label>
        <button type="submit">장치 상세로 이동</button>
    </form>
</main>
</body>
</html>
