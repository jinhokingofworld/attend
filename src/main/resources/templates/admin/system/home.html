<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>플랫폼 운영</title>    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<header th:replace="~{fragments/admin-shell :: header}"></header>
<main>
    <h1>플랫폼 운영</h1>
    <p>개발자·플랫폼 운영자 전용 화면입니다. 고객 측 부서 관리자에게는 노출되지 않습니다.</p>
    <p th:unless="${writeEnabled}">현재 관리자 쓰기가 중지된 읽기 전용 모드입니다.</p>
    <nav>
        <a th:href="@{/admin/system/departments}">부서</a>
        <a th:href="@{/admin/system/accounts}">관리자 계정</a>
        <a th:href="@{/admin/system/operations}">운영 상태</a>
        <a th:href="@{/admin/system/audit}">시스템 감사</a>
        <a th:href="@{/admin/workspaces}">작업 공간 전환</a>
        <a th:href="@{/admin/account/password}">내 비밀번호 변경</a>
    </nav>
    <section>
        <h2>요약</h2>
        <p th:text="|부서 ${#lists.size(departments)}개 · 계정 ${#lists.size(accounts)}개|">요약</p>
        <p><a th:href="@{/admin/system/devices}">장치 수명주기 관리</a></p>
    </section>
</main>
</body>
</html>
