<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<main class="login-shell">
    <h1>Attend 관리자</h1>
    <p>교사 출석과 NFC 장치를 관리합니다.</p>
    <div class="message message--error" th:if="${param.error}" role="alert">
        <p>사용자명이나 비밀번호가 올바르지 않습니다.</p>
    </div>

    <div class="message message--success" th:if="${param.logout}">
        <p>로그아웃했습니다.</p>
    </div>

    <div class="message message--info" th:if="${param.expired}">
        <p>세션 사용 시간이 만료되었습니다. 다시 로그인해 주세요.</p>
    </div>

    <div class="message message--error" th:if="${param.limited}" role="alert">
        <p>로그인 요청을 처리할 수 없습니다. 잠시 후 다시 시도해 주세요.</p>
    </div>

    <form th:action="@{/authentication}" method="post" th:object="${loginForm}">
        <div><!-- 사용자명 -->
            <label for="usernameInput">사용자명</label>
            <input id="usernameInput"
                   type="text"
                   autocomplete="username"
                   th:field="*{usernameInput}"
                   required
                   autofocus>
        </div>

        <div><!-- 비밀번호 -->
            <label for="passwordInput">비밀번호</label>
            <input id="passwordInput"
                   type="password"
                   autocomplete="current-password"
                   th:field="*{passwordInput}"
                   required>
        </div>
        <div>
            <input type="submit" value="로그인">
        </div>
    </form>
</main>
</body>
</html>
