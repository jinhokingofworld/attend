<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>form</title>
</head>
<body>

<button onclick="sendAttendance()">출석하기</button>

<p id="result"></p>

<script>
    function sendAttendance() {
        fetch("/api/attendance", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                uid: "06EA3L"
            })
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById("result").innerText = data.message || "출석 완료";
        })
        .catch(error => {
            document.getElementById("result").innerText = error.message;
        });
    }
</script>

</body>
</html>
