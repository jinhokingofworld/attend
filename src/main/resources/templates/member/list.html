<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>멤버 리스트</title>
</head>
<body>
    <h2>회원 명단</h2>
    <!--플래시 메시지 표시-->
    <p th:if="${errorMessage}"
        th:text="${errorMessage}" style="color: red;">에러 메시지</p>
    <p th:if="${message}"
       th:text="${message}" style="color: blue;">메시지</p>

    <table border="1" width="300">
        <thead>
            <tr>
                <th>ID</th>
                <th>이름</th>
                <th>상세보기</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="m : ${members}">
                <td th:text="${m.id}"></td>
                <td th:text="${m.name}"></td>
                <td> <!-- REST 형식-->
                    <a th:href="@{/member/{id}(id=${m.id})}">상세보기</a>
                </td>
            </tr>
        </tbody>
    </table>
    <a th:href="@{/member/insert}">회원 추가</a>
    <br>
    <a th:href="@{/}">메뉴 화면으로</a>
</body>
</html>
