<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title th:text="${purpose.name() == 'INVITATION' ? '회원가입 설정' : '비밀번호 재설정'}">계정 설정</title>
</head>
<body>
<main>
    <h1 th:text="${purpose.name() == 'INVITATION' ? '회원가입 설정' : '비밀번호 재설정'}">계정 설정</h1>

    <div th:if="${completed}">
        <p>비밀번호 설정을 완료했습니다. 이 링크는 다시 사용할 수 없습니다.</p>
        <a th:href="@{/login}">로그인</a>
    </div>

    <div th:unless="${completed}">
        <p th:if="${error}" th:text="${error}" role="alert"></p>
        <p>새 비밀번호는 12~64자이고 UTF-8 기준 72 byte 이하여야 합니다.</p>
        <form method="post"
              th:action="${purpose.name() == 'INVITATION'} ? @{/account/setup} : @{/account/password-reset}">
            <input id="credentialToken" type="hidden" name="token" value="">
            <div>
                <label for="password">새 비밀번호</label>
                <input id="password" type="password" name="password"
                       autocomplete="new-password" required>
            </div>
            <div>
                <label for="passwordConfirmation">새 비밀번호 확인</label>
                <input id="passwordConfirmation" type="password"
                       name="passwordConfirmation"
                       autocomplete="new-password" required>
            </div>
            <button type="submit">설정 완료</button>
        </form>
        <p id="missingToken" hidden role="alert">링크에 필요한 정보가 없습니다.</p>
    </div>
</main>
<script>
(() => {
    const params = new URLSearchParams(window.location.hash.slice(1));
    const token = params.get("token");
    window.history.replaceState(null, "", window.location.pathname);
    const input = document.getElementById("credentialToken");
    if (input && token) {
        input.value = token;
    } else if (input) {
        document.getElementById("missingToken").hidden = false;
    }
})();
</script>
</body>
</html>
