# Pilot-only resource guardrails for an Oracle Linux 9 VM.Standard.E2.1.Micro
# host. Always merge this file after compose.prod.yaml; it is not standalone.
services:
  app:
    platform: linux/amd64
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Xms96m
        -Xmx256m
        -Xss512k
        -XX:MaxMetaspaceSize=96m
        -XX:MaxDirectMemorySize=32m
        -XX:ReservedCodeCacheSize=48m
        -XX:+UseSerialGC
        -XX:+ExitOnOutOfMemoryError
    mem_limit: 544m
    mem_reservation: 320m
    memswap_limit: 544m
    pids_limit: 256
    oom_kill_disable: false
    init: true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  retention:
    platform: linux/amd64
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Xms32m
        -Xmx96m
        -Xss512k
        -XX:MaxMetaspaceSize=64m
        -XX:MaxDirectMemorySize=16m
        -XX:ReservedCodeCacheSize=32m
        -XX:+UseSerialGC
        -XX:+ExitOnOutOfMemoryError
    mem_limit: 128m
    mem_reservation: 48m
    memswap_limit: 128m
    pids_limit: 64
    oom_kill_disable: false
    init: true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "3"

  caddy:
    platform: linux/amd64
    mem_limit: 96m
    mem_reservation: 32m
    memswap_limit: 96m
    pids_limit: 128
    oom_kill_disable: false
    init: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
