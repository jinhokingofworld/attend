services:
  app:
    build:
      context: .
      target: runtime
    image: attend:${ATTEND_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      ACCOUNT_TOKEN_PEPPER: ${ACCOUNT_TOKEN_PEPPER:?ACCOUNT_TOKEN_PEPPER is required}
      DEVICE_CREDENTIAL_PEPPER: ${DEVICE_CREDENTIAL_PEPPER:?DEVICE_CREDENTIAL_PEPPER is required}
      TRUSTED_PROXY_TOKEN: ${TRUSTED_PROXY_TOKEN:?TRUSTED_PROXY_TOKEN is required}
      ADMIN_WRITE_ENABLED: ${ADMIN_WRITE_ENABLED:-false}
      DEVICE_API_ENABLED: ${DEVICE_API_ENABLED:-false}
      ATTENDANCE_SCHEDULER_ENABLED: ${ATTENDANCE_SCHEDULER_ENABLED:-false}
      MANAGEMENT_SERVER_ADDRESS: 127.0.0.1
      MANAGEMENT_SERVER_PORT: 8081
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - private
    security_opt:
      - no-new-privileges:true

  retention:
    build:
      context: .
      target: retention
    image: attend-retention:${ATTEND_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      RETENTION_DB_URL: ${RETENTION_DB_URL:?RETENTION_DB_URL is required}
      RETENTION_DB_USERNAME: ${RETENTION_DB_USERNAME:?RETENTION_DB_USERNAME is required}
      RETENTION_DB_PASSWORD: ${RETENTION_DB_PASSWORD:?RETENTION_DB_PASSWORD is required}
      RETENTION_RUN_INTERVAL_SECONDS: ${RETENTION_RUN_INTERVAL_SECONDS:-86400}
    networks:
      - private
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST is required}
      ACME_CONTACT_EMAIL: ${ACME_CONTACT_EMAIL:?ACME_CONTACT_EMAIL is required}
      TRUSTED_PROXY_TOKEN: ${TRUSTED_PROXY_TOKEN:?TRUSTED_PROXY_TOKEN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - private
    security_opt:
      - no-new-privileges:true

networks:
  private:
    internal: false

volumes:
  caddy_data:
  caddy_config:
