name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          validate-wrappers: true

      - name: Run checks and build executable JAR
        run: ./gradlew check bootJar migrationBootJar --no-daemon --stacktrace

      - name: Verify packaged database resources
        shell: bash
        run: |
          set -euo pipefail

          artifact_path="build/libs/attend-app.jar"
          migration_artifact_path="build/libs/attend-migration.jar"
          test -f "${artifact_path}"
          test -f "${migration_artifact_path}"

          unzip -p "${artifact_path}" META-INF/MANIFEST.MF \
            | grep -F 'Start-Class: com.example.attend.AttendApplication'
          unzip -p "${migration_artifact_path}" META-INF/MANIFEST.MF \
            | grep -F 'Start-Class: com.example.attend.database.DatabaseMigrationCli'

          jar tf "${artifact_path}" > build/jar-contents.txt

          for version in 001 002 003 004 005 006 007 008; do
            grep -Eq "BOOT-INF/classes/db/migration/V${version}__.+[.]sql$" build/jar-contents.txt
          done

          migration_count="$(
            grep -Ec 'BOOT-INF/classes/db/migration/V[0-9]+__.+[.]sql$' build/jar-contents.txt
          )"
          test "${migration_count}" -eq 8

          if grep -Eq 'BOOT-INF/classes/(schema|data)[.]sql$' build/jar-contents.txt; then
            echo "Destructive legacy SQL initialization resource found in the application JAR."
            exit 1
          fi

      - name: Validate runtime Compose without migration credentials
        env:
          DB_URL: jdbc:postgresql://db.example.test/attend
          DB_USERNAME: app_runtime
          DB_PASSWORD: ci-runtime-password
          PUBLIC_BASE_URL: https://attendance.example.test
          PUBLIC_HOST: attendance.example.test
          ACME_CONTACT_EMAIL: operator@example.test
          ACCOUNT_TOKEN_PEPPER: ci-account-token-pepper-at-least-32-bytes
          DEVICE_CREDENTIAL_PEPPER: ci-device-pepper-at-least-32-bytes
          TRUSTED_PROXY_TOKEN: ci-proxy-token-that-is-at-least-32-bytes
        run: >-
          docker compose --env-file /dev/null -f compose.prod.yaml config
          --no-env-resolution --quiet

      - name: Validate migration Compose without runtime credentials
        env:
          FLYWAY_DB_URL: jdbc:postgresql://direct-db.example.test/attend
          FLYWAY_DB_USERNAME: migration_owner
          FLYWAY_DB_PASSWORD: ci-migration-password
          MIGRATION_SOURCE_CLASS: NEW_OR_SAMPLE
        run: >-
          docker compose --env-file /dev/null -f compose.migration.yaml config
          --no-env-resolution --quiet

      - name: Validate local hardware-free demo Compose
        run: docker compose --env-file /dev/null -f compose.local.yaml config --quiet

      - name: Build runtime and migration container images
        run: |
          docker build --target runtime --tag attend:ci .
          docker build --target migration --tag attend-migration:ci .

      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            --env PUBLIC_HOST=attendance.example.test \
            --env ACME_CONTACT_EMAIL=operator@example.test \
            --env TRUSTED_PROXY_TOKEN=ci-proxy-token-that-is-at-least-32-bytes \
            --volume "${PWD}/ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Validate operational shell scripts
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            ops/backup/backup.sh
            ops/backup/restore-verify.sh
            scripts/device-smoke.sh
            scripts/local-http-demo.sh
            scripts/pilot-http-simulator.sh
          )
          bash -n "${scripts[@]}"
          shellcheck "${scripts[@]}"

          set +e
          RESTORE_DATABASE_URL='postgresql://restore.example.test/attend' \
            RESTORE_DUMP_FILE='build.gradle' \
            RESTORE_CHECKSUM_FILE='src/test/resources/ops/invalid-backup.sha256' \
            ./ops/backup/restore-verify.sh
          restore_status="$?"
          set -e
          test "${restore_status}" -eq 5

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: warn
          retention-days: 7
